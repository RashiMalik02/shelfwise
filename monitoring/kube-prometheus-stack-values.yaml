# helm install monitoring prometheus-community/kube-prometheus-stack \
#   -n monitoring --create-namespace -f monitoring/kube-prometheus-stack-values.yaml
#
# Trimmed for a laptop-sized cluster: no Alertmanager, short retention, and the
# control-plane scrapers that kind doesn't expose are switched off (they would
# otherwise show as permanently DOWN targets).

fullnameOverride: monitoring

alertmanager:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 2d
    scrapeInterval: 15s
    # Pick up ServiceMonitors from every namespace, not only ones labelled for this release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    resources:
      requests: { cpu: 100m, memory: 384Mi }
      limits: { memory: 1Gi }

grafana:
  # Login: admin / password from the secret (see monitoring/README.md).
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: browser
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  # Grafana 13 sits around 450Mi once dashboards load; 320Mi got it OOMKilled.
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 640Mi }

kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

prometheus-node-exporter:
  # kind nodes on Docker Desktop don't have a shared root mount.
  hostRootFsMount:
    enabled: false

prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
