# helm install metrics-server metrics-server/metrics-server -n kube-system -f monitoring/metrics-server-values.yaml
# The HPA reads pod CPU from metrics-server. kind's kubelets use self-signed certs,
# hence --kubelet-insecure-tls (EKS ships metrics-server as an add-on instead, see terraform/main.tf).
args:
  - --kubelet-insecure-tls
