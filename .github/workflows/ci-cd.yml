name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- quality gates
  backend-tests:
    name: Backend · lint + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Run tests
        run: pytest -v --cov=app --cov-report=term-missing --junitxml=pytest-report.xml
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-report
          path: backend/pytest-report.xml

  frontend-build:
    name: Frontend · test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  infra-lint:
    name: Helm + Terraform checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Lint Helm chart
        run: |
          helm lint helm/shelfwise
          helm lint helm/shelfwise -f helm/shelfwise/values-local.yaml -f helm/shelfwise/values-release.yaml
          helm lint helm/shelfwise -f helm/shelfwise/values-eks.yaml
          helm template smoke helm/shelfwise -f helm/shelfwise/values-local.yaml > /dev/null
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: Terraform fmt + validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: Terraform tests (mocked AWS provider, no credentials needed)
        working-directory: terraform
        run: terraform test

  # ------------------------------------------------- build → scan → push images
  images:
    name: Image · ${{ matrix.service }}
    needs: [backend-tests, frontend-build, infra-lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image name
        id: meta
        run: |
          # Registry paths must be lowercase; the GitHub username is not.
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=${REGISTRY}/${owner}/shelfwise-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.service }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          build-args: APP_BUILD=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Trivy scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          version: v0.76.0
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (tagged with commit SHA)
        if: github.event_name != 'pull_request'
        run: |
          docker push "${{ steps.meta.outputs.image }}:${{ github.sha }}"
          echo "### ${{ matrix.service }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pushed \`${{ steps.meta.outputs.image }}:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------------- deploy
  # Two delivery paths, picked with the repository variable DEPLOY_TARGET:
  #   eks   -> helm upgrade straight into the EKS cluster created by terraform/
  #   (unset/local) -> bump the image tag in Git; Argo CD in the local kind cluster pulls it
  deploy-eks:
    name: Deploy · EKS
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_TARGET == 'eks'
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Point kubectl at the cluster
        run: aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME || 'shelfwise-eks' }}" --region "${{ vars.AWS_REGION || 'ap-south-1' }}"
      - name: Helm upgrade
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          helm upgrade --install shelfwise helm/shelfwise \
            --namespace shelfwise --create-namespace \
            -f helm/shelfwise/values-eks.yaml \
            --set "backend.image.repository=ghcr.io/${owner}/shelfwise-backend" \
            --set "frontend.image.repository=ghcr.io/${owner}/shelfwise-frontend" \
            --set "backend.image.tag=${GITHUB_SHA}" \
            --set "frontend.image.tag=${GITHUB_SHA}" \
            --wait --timeout 10m
          kubectl -n shelfwise rollout status deploy/shelfwise-backend
          kubectl -n shelfwise get pods -o wide

  promote-gitops:
    name: Deploy · bump GitOps image tag
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_TARGET != 'eks'
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write new tags to values-release.yaml
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          cat > helm/shelfwise/values-release.yaml <<EOF
          # Written by the promote-gitops job in .github/workflows/ci-cd.yml - do not edit by hand.
          # Argo CD watches this file; a new commit here is what rolls the local cluster forward.
          backend:
            image:
              repository: ghcr.io/${owner}/shelfwise-backend
              tag: "${GITHUB_SHA}"
          frontend:
            image:
              repository: ghcr.io/${owner}/shelfwise-frontend
              tag: "${GITHUB_SHA}"
          EOF
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/shelfwise/values-release.yaml
          if git diff --cached --quiet; then echo "nothing to promote"; exit 0; fi
          git commit -m "Promote images ${GITHUB_SHA::7} to the local cluster [skip ci]"
          git push
