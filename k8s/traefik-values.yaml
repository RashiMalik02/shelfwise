# helm install traefik traefik/traefik -n traefik --create-namespace -f k8s/traefik-values.yaml
# (ingress-nginx was archived upstream in March 2026, so this project uses Traefik.)
service:
  type: NodePort
ports:
  web:
    nodePort: 30080
  websecure:
    nodePort: 30443
ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik
providers:
  kubernetesIngress:
    enabled: true
    # A NodePort Service has no load-balancer address to copy; use the fixed IP below instead.
    publishedService:
      enabled: false
  kubernetesCRD:
    enabled: false
# kind maps the NodePorts to 127.0.0.1; publishing that address on Ingress status
# lets `kubectl get ingress` show it and lets Argo CD mark the Ingress Healthy.
additionalArguments:
  - --providers.kubernetesingress.ingressendpoint.ip=127.0.0.1
accessLog:
  enabled: true
resources:
  requests: { cpu: 50m, memory: 64Mi }
  limits: { cpu: 300m, memory: 192Mi }
