# Local cluster: kind create cluster --config k8s/kind-config.yaml
# Traefik's NodePorts (30080/30443) are mapped to ports 80/443 on your machine,
# so http://shelfwise.localtest.me reaches the Ingress directly.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: shelfwise
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        listenAddress: "127.0.0.1"
      - containerPort: 30443
        hostPort: 443
        listenAddress: "127.0.0.1"
