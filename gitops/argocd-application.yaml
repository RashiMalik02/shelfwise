# Argo CD keeps the local cluster in sync with helm/shelfwise on the main branch.
# The CI job "promote-gitops" rewrites values-release.yaml with the new image SHA,
# Argo CD notices the commit and rolls the Deployments forward.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shelfwise
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/RashiMalik02/shelfwise.git
    targetRevision: main
    path: helm/shelfwise
    helm:
      releaseName: shelfwise
      valueFiles:
        - values.yaml
        - values-local.yaml
        - values-release.yaml
      parameters:
        # Created once by scripts/argocd-up.sh, never rendered by the chart.
        - name: postgres.existingSecret
          value: shelfwise-db
  destination:
    server: https://kubernetes.default.svc
    namespace: shelfwise
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    # Replica count belongs to the HPA, not to Git.
    - group: apps
      kind: Deployment
      name: shelfwise-backend
      jsonPointers: ["/spec/replicas"]
