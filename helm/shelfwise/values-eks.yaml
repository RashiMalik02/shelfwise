# EKS cluster created by terraform/. Install an ingress controller first
# (Traefik with a LoadBalancer Service, or the AWS Load Balancer Controller with className: alb).
backend:
  environment: eks
  autoscaling:
    maxReplicas: 8

postgres:
  storageClassName: gp2   # EBS default class on EKS; needs the aws-ebs-csi-driver add-on for gp3

ingress:
  className: traefik
  # No DNS name yet? Leave host empty to match any hostname and use the load balancer's address.
  host: ""

monitoring:
  serviceMonitor:
    enabled: true
  grafanaDashboard:
    enabled: true
