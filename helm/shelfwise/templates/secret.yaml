{{- if not .Values.postgres.existingSecret }}
{{- $password := include "shelfwise.postgresPassword" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shelfwise.secretName" . }}
  labels:
    {{- include "shelfwise.labels" . | nindent 4 }}
  annotations:
    # Survive `helm uninstall` so a reinstall can still open the existing volume.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ $password | quote }}
  {{- if .Values.postgres.externalDatabaseUrl }}
  DATABASE_URL: {{ .Values.postgres.externalDatabaseUrl | quote }}
  {{- else }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@%s:5432/%s" .Values.postgres.username $password (include "shelfwise.postgresName" .) .Values.postgres.database | quote }}
  {{- end }}
{{- end }}
