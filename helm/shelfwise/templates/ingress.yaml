{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "shelfwise.fullname" . }}
  labels:
    {{- include "shelfwise.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          # /api/* (and the Swagger UI) go straight to FastAPI ...
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "shelfwise.backendName" . }}
                port:
                  name: http
          - path: /docs
            pathType: Exact
            backend:
              service:
                name: {{ include "shelfwise.backendName" . }}
                port:
                  name: http
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: {{ include "shelfwise.backendName" . }}
                port:
                  name: http
          # ... everything else is the React app.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "shelfwise.frontendName" . }}
                port:
                  name: http
{{- end }}
